services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: github_radar
      POSTGRES_USER: github_radar
      POSTGRES_PASSWORD: github_radar
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_radar -d github_radar"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - github_radar_postgres:/var/lib/postgresql/data

volumes:
  github_radar_postgres:
